# 双拼单字反查词典的编译桩（同 mohu_pinyin.schema.yaml 模式）：
# Rime 部署只为「被部署 schema 的 translator 词典 + dependency schema 的
# 主词典」产出编译件；本桩让 tiger 的依赖链把 mohu_rev_flypy 编译成
# .table.bin。勿在方案选单中启用。
schema:
  schema_id: mohu_rev_flypy
  name: 勿用·小鹤双拼反查
  version: "1.0"

engine:
  translators:
    - table_translator

translator:
  dictionary: mohu_rev_flypy
  enable_user_dict: false
