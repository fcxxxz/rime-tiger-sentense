name: Package release zip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build zip
        run: python3 make_dist.py

      - name: Verify zip contents
        run: |
          python3 - <<'EOF'
          import zipfile, sys
          required = [
            "tiger-sentence/tiger.schema.yaml",
            "tiger-sentence/tiger.dict.yaml",
            "tiger-sentence/default.yaml",
            "tiger-sentence/lua/mohu_sentence.lua",
            "tiger-sentence/lua/mohu_tiger_sentence.lua",
            "tiger-sentence/lua/mohu_runtime.lua",
            "tiger-sentence/mohu/runtime/libtigerengine.dylib",
            "tiger-sentence/mohu/data/tiger/tiger.lexicon.txt",
          ]
          with zipfile.ZipFile("dist/tiger-sentence-latest.zip") as z:
            names = set(z.namelist())
            missing = [r for r in required if r not in names]
          if missing:
            print("MISSING:", missing); sys.exit(1)
          print(f"OK: {len(names)} files, all required files present")
          EOF
          cd dist && sha256sum tiger-sentence-latest.zip | tee ../zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiger-sentence-latest
          path: |
            dist/tiger-sentence-latest.zip
            zip.sha256
          if-no-files-found: error

      - name: Create release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "虎整 $GITHUB_REF_NAME" \
            --notes "安装：解压 zip 全部内容到 Rime 用户目录；模型 mohu-sentence-ngram-v5.bin 从 Release 资产下载后放入 mohu/model/，重新部署并完全重启输入法。sha256 见 zip.sha256。" \
            dist/tiger-sentence-latest.zip zip.sha256
